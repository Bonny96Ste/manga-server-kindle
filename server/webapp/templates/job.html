{% extends 'base.html' %}
{% block title %}Download · Manga Library{% endblock %}
{% block content %}<section class="job-card"><span class="eyebrow">Background job</span><h1>{{ job.title }}</h1><span class="badge {% if job.status=='done' %}success{% endif %}" id="job-status">{{ job.status }}</span><p id="job-message">{{ job.error or job.message or 'Queued' }}</p><div class="download-progress"><div class="progress-track"><span id="job-progress"></span></div></div><div class="card-actions"><a class="button secondary" href="{{ url_for('series_view', series_path=job.series_path) if job.series_path else url_for('library_home') }}">Back to series</a><a class="button secondary" href="{{ url_for('activity_view') }}">Activity</a></div></section>{% endblock %}
{% block scripts %}<script>async function refreshJob(){const data=await(await fetch({{ url_for('job_api',job_id=job.id)|tojson }})).json();document.getElementById('job-status').textContent=data.status;document.getElementById('job-message').textContent=data.error||data.message||data.status;if(data.progress_total>0)document.getElementById('job-progress').style.width=`${Math.min(100,data.progress_current/data.progress_total*100)}%`;if(data.status==='done'&&data.reader_url){location.replace(data.reader_url);return;}if(data.status==='queued'||data.status==='running')setTimeout(refreshJob,1000);}refreshJob();</script>{% endblock %}
